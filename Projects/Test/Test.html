<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Product - PriceDrop</title>
    <style>
        body { font-family: sans-serif; padding: 40px; }
        .product-container { max-width: 600px; padding: 20px; border: 1px solid #ccc; border-radius: 12px; }
        .mrp { text-decoration: line-through; color: #888; font-size: 1.2em; }
        .deal-price { color: #b12704; font-size: 2em; font-weight: bold; margin-left: 10px; }
    </style>
</head>
<body>

    <div class="product-container">
        <!-- The scraper should pick this up as the title -->
        <h1 id="product-title" data-testid="product-title">Sony WH-1000XM5 Headphones</h1>
        
        <div class="pricing">
            <span class="mrp">₹34,990</span>
            <!-- The scraper will target this price -->
            <span class="deal-price" id="current-price">₹29,990</span>
        </div>
    </div>

</body>
</html>
